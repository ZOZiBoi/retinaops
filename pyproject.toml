[project]
name = "retinaops"
version = "0.1.0"
description = "RetinaOps: MLOps pipeline for diabetic retinopathy grading (APTOS 2019)"
authors = [
    { name = "Zoraiz Anwar", email = "zoraizanwar.bss@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "mlflow>=3",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
